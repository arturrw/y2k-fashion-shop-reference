services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: y2k
      POSTGRES_PASSWORD: y2k
      POSTGRES_DB: y2k_shop
    ports:
      - "5432:5432" # dev access; remove in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U y2k -d y2k_shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://y2k:y2k@db:5432/y2k_shop
    ports:
      - "4321:4321" # direct access, bypassing nginx; remove in production
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # one-shot: docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://y2k:y2k@db:5432/y2k_shop
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
